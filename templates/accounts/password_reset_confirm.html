{% extends "admin/base_site.html" %}
{% block content %}
<div class="ce-admin-wrap"><div class="ce-admin-card">
  {% if validlink %}
    <h1>Choose a new password</h1>
    <form method="post">{% csrf_token %}
      {{ form.as_p }}
      <input type="submit" class="default" value="Save new password">
    </form>
  {% else %}
    <h1>This password reset link is invalid or has expired</h1>
    <p>Please ask the Club Emprendo team to send you a new link.</p>
  {% endif %}
</div></div>
{% endblock %}
