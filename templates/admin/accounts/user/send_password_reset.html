{% extends "admin/base_site.html" %}
{% block content %}
<div class="ce-admin-wrap"><div class="ce-admin-card">
  <p>Send <strong>{{ original.display_name }}</strong> a secure link to choose a new password at <strong>{{ original.email }}</strong>.</p>
  <p>Their current password will continue to work until they use the link to save a new one.</p>
  <form method="post">{% csrf_token %}
    <input type="submit" class="default" value="Send password reset email">
    <a href="{% url 'admin:accounts_user_change' original.pk %}">Back to account</a>
  </form>
</div></div>
{% endblock %}
