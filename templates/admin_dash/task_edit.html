{% extends "admin/base_site.html" %}

{% block title %}Edit task · Tasks · Club Emprendo Admin{% endblock %}

{% block content %}
<div class="ce-admin-wrap">
  <div class="ce-admin-card ce-admin-card--wide">
    <style>
      .ce-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 12px 0 16px;
      }
      .ce-btn {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid #223413;
        background: #223413;
        color: #fff !important;
        text-decoration: none;
        font-weight: 600;
      }
      .ce-btn--ghost {
        background: #fff;
        color: #223413 !important;
      }
      .ce-form p {
        margin-bottom: 12px;
      }
      .ce-form input,
      .ce-form select,
      .ce-form textarea {
        width: 100%;
        max-width: 680px;
        box-sizing: border-box;
        padding: 8px;
      }
      .ce-form select {
        height: auto !important;
        min-height: 42px;
        line-height: 1.45;
        padding-top: 9px;
        padding-bottom: 9px;
      }
      .ce-form option {
        line-height: 1.45;
      }
      .ce-submit {
        border: 1px solid #223413;
        background: #223413;
        color: #fff;
        border-radius: 8px;
        padding: 8px 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .ce-muted {
        color: #666;
        font-size: 13px;
      }
      .ce-form { max-width: 720px; }
      .ce-form p > label { display: block; margin-bottom: 6px; color: var(--ce-gray-700); font-size: 13px; font-weight: 600; }
      .ce-form p > input:not([type="checkbox"]):not([type="radio"]),
      .ce-form p > select,
      .ce-form p > textarea { width: 100%; max-width: none; box-sizing: border-box; }
      .ce-form .helptext { display: block; margin-top: 4px; color: var(--ce-text-muted); font-size: 12.5px; }
    </style>

    <h1 class="ce-work-title" style="margin: 0;">Edit Task</h1>
    <p class="ce-muted" style="margin: 8px 0 0;">{{ task.title }}</p>
    <div class="ce-actions">
      <a class="ce-btn ce-btn--ghost" href="{% url 'admin_task_manager_user_tasks' task.assigned_to_id %}">Back to user tasks</a>
      <a class="ce-btn ce-btn--ghost" href="{{ task_type_admin_url }}">Edit task types</a>
    </div>

    <form method="post" class="ce-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="ce-submit" type="submit">Save changes</button>
    </form>
  </div>
</div>
{% endblock %}
